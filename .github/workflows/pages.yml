name: Pages release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  configuration:
    runs-on: ubuntu-latest
    outputs:
      initialized: ${{ steps.project.outputs.initialized }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: project
        run: |
          if [[ "$(python3 scripts/project.py status)" == "initialized" ]]; then
            echo 'initialized=true' >> "$GITHUB_OUTPUT"
          else
            echo 'initialized=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Game uninitialized; production deployment skipped.'
          fi
  build:
    needs: configuration
    if: needs.configuration.outputs.initialized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Release checks and isolated output
        run: |
          DEV_TEMPLATE_INSTALL_SYSTEM_DEPS=1 bash scripts/setup.sh
          source scripts/env.sh
          python3 scripts/project.py install
          python3 scripts/project.py check release
          python3 scripts/project.py build
          python3 scripts/project.py stage
      - name: Retain release verification evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: verification-${{ github.sha }}
          retention-days: 1
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            .artifacts/story/browser.json
            .artifacts/story/*-gallery.png
            .artifacts/story/*-challenges.png
            .artifacts/checks-release.json
            .artifacts/skills/browser.json
            .artifacts/world/browser.json
            .artifacts/v8/browser.json
            .artifacts/v8/*-territory.png
            .artifacts/v8/*-daily.png
            .artifacts/v8/*-jupiter-combat.png
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .artifacts/site
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

